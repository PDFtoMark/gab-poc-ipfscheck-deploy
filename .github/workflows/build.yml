name: Build

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main

env:
  BUILD_PATH: 'web'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: website-build-${{ github.run_id }}
          path: ${{ env.BUILD_PATH }}
          retention-days: 1
